name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests (cart logic)
        run: npm test

      - name: Lint
        run: npm run lint

      # NOTE: `npm run build` is intentionally not run here yet — static
      # generation needs live Sanity credentials. Add repository secrets
      # (NEXT_PUBLIC_SANITY_PROJECT_ID, etc.) and a build step once the
      # project is ready for deploy-gating CI.
